[workspace]
resolver = "2"
members = ["crates/os-model", "crates/os-flp", "crates/os-engine", "crates/os-dsp", "tools/flp-dump", "tools/os-render", "tools/os-play", "tools/bundle-app", "crates/os-native", "tools/os-native-probe", "crates/os-theme", "crates/os-ui", "crates/os-app", "crates/os-android", "plugins/lemon-sampler", "tools/bundle-plugins", "crates/os-clap", "crates/os-hostlink", "crates/os-plugkit", "plugins/lemon-parametric-eq-2", "crates/os-host", "crates/os-vst3", "crates/os-vst2", "plugins/lemon-3x-osc", "plugins/lemon-limiter", "plugins/lemon-reverb", "plugins/lemon-delay", "plugins/mango-beat", "plugins/lemon-small-fx", "plugins/lemon-soft-clipper", "plugins/lemon-fast-distortion", "plugins/lemon-balance", "plugins/lemon-stereo-enhancer", "plugins/lemon-transient-processor", "plugins/lemon-chorus", "plugins/lemon-stereo-shaper", "plugins/lemon-filter", "plugins/lemon-flanger", "plugins/lemon-phaser", "plugins/lemon-crusher", "plugins/lemon-twelve", "plugins/citrus", "plugins/tesla", "plugins/pulp-filter", "plugins/press", "plugins/lemon-small-gen", "plugins/mango-monk", "plugins/mango-surface", "plugins/lemon-kick", "plugins/lemon-boom", "plugins/lemon-bass", "plugins/lemon-acid", "plugins/lemon-pluck", "plugins/lemon-mini", "plugins/lemon-dx", "plugins/lemon-autogun", "plugins/lemon-drums", "plugins/lemon-drum-sampler", "plugins/lemon-slicer", "plugins/lemon-keys", "plugins/lemon-wavetable", "plugins/mango-soundfont", "crates/os-paths", "tools/watermark", "crates/os-smf", "tools/notices", "plugins/lemon-vocoder", "plugins/mango-beepmap", "plugins/mango-flex", "plugins/mango-slayer", "plugins/mango-dashboard", "plugins/mango-directwave", "plugins/mango-sfxr"]

[workspace.package]
version = "0.6.1"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
os-model = { path = "crates/os-model" }
os-flp = { path = "crates/os-flp" }
os-engine = { path = "crates/os-engine" }
os-dsp = { path = "crates/os-dsp" }
os-hostlink = { path = "crates/os-hostlink" }
os-host = { path = "crates/os-host" }
os-vst3 = { path = "crates/os-vst3" }
os-vst2 = { path = "crates/os-vst2" }
os-paths = { path = "crates/os-paths" }
os-smf = { path = "crates/os-smf" }
thiserror = "2"

[profile.dev]
opt-level = 3
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# cpal 0.18.2 with one Android change (see vendor/cpal/src/host/aaudio/mod.rs): the AAudio stream
# asks for the low-latency performance mode, which upstream only does under its `realtime` feature —
# and that feature's alsa-sys and audio_thread_priority cannot build on Android. Desktop targets
# compile this tree exactly as upstream's.
[patch.crates-io]
cpal = { path = "vendor/cpal" }
